name: Deploy Pathway to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Redeploy regularly so new IRCC rounds reach the site without a code push.
  schedule:
    - cron: '23 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'

      - name: Refresh IRCC rounds snapshot
        id: ircc
        continue-on-error: true
        run: node scripts/refresh-v4-ircc.mjs

      - name: Verify IRCC parser
        run: node scripts/verify-v4-ircc.mjs

      - name: Build
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          cp CNAME dist/client/CNAME
          touch dist/client/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # The site was still deployed with the last committed snapshot, but a
      # failed refresh must be visible (red run + GitHub notification).
      - name: Report IRCC refresh failure
        if: steps.ircc.outcome == 'failure'
        run: |
          echo "::error::IRCC rounds could not be refreshed from canada.ca; the site shows the last committed snapshot. See the 'Refresh IRCC rounds snapshot' step."
          exit 1
