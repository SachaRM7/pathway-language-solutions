<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Tu código · Campus Pathway</title>
<style>
  :root { --ink: #141414; --soft: #f3f3f2; --coral: #f05a36; --mint: #dcf3e4; --mint-ink: #1d7a49; color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 18px; background: #f2f2f0; color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  main { width: 100%; max-width: 420px; padding: 28px 22px; border-radius: 28px; background: #fff; box-shadow: 0 20px 60px rgb(0 0 0 / 8%); text-align: center; }
  .tag { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--coral); }
  h1 { margin: 8px 0 18px; font-size: 24px; line-height: 1.2; }
  .code { margin: 0 0 18px; padding: 16px 10px; border-radius: 18px; background: var(--soft); font: 800 clamp(28px, 9vw, 38px)/1 "SF Mono", ui-monospace, Menlo, monospace; letter-spacing: .14em; -webkit-user-select: all; user-select: all; }
  button, a.btn { display: block; width: 100%; padding: 16px; border: 0; border-radius: 999px; font-family: inherit; font-size: 16px; font-weight: 700; line-height: 1; text-decoration: none; cursor: pointer; }
  button { background: var(--ink); color: #fff; }
  button.is-done { background: var(--mint); color: var(--mint-ink); }
  a.btn { margin-top: 10px; background: var(--soft); color: var(--ink); }
  p.note { margin: 16px 0 0; font-size: 13px; color: #6b6b73; }
  @media (prefers-color-scheme: dark) {
    body { background: #0c0c0e; color: #f3f3f2; } main { background: #18181b; box-shadow: none; }
    .code, a.btn { background: #26262a; color: #f3f3f2; } button { background: #f3f3f2; color: #141414; } p.note { color: #9b9ba3; }
  }
</style>
</head>
<body>
<main>
  <p class="tag">Campus Pathway</p>
  <h1>Tu código de acceso</h1>
  <p class="code" id="code">—</p>
  <button type="button" id="copy">Copiar el código</button>
  <a class="btn" href="/campus/">Volver al campus</a>
  <p class="note" id="note">Vuelve al campus y pega el código en las casillas.</p>
</main>
<script>
  // The code travels in the #fragment: it is never sent to the server.
  const code = decodeURIComponent(location.hash.slice(1)).replace(/\D/g, '').slice(0, 10);
  const box = document.getElementById('code'), btn = document.getElementById('copy');
  if (code) box.textContent = code; else { btn.disabled = true; document.getElementById('note').textContent = 'Este enlace no trae ningún código. Usa el del correo.'; }
  history.replaceState(null, '', location.pathname);
  btn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(code); }
    catch (e) {
      const r = document.createRange(); r.selectNodeContents(box);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy');
    }
    btn.textContent = 'Código copiado ✓'; btn.classList.add('is-done');
    document.getElementById('note').textContent = 'Vuelve al campus: toca la primera casilla y pega.';
  });
</script>
</body>
</html>
