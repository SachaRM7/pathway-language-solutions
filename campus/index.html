<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f2f0">
<title>Campus Pathway</title>
<link rel="icon" href="/v4/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=EB+Garamond:ital,wght@0,400..700;1,400..600&display=swap">
<link rel="stylesheet" href="campus.css">
</head>
<body data-campus>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19z"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8.2 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.8"/></symbol>
    <symbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="6.5" width="13" height="14" rx="3"/><path d="M7.5 3.5h10a3 3 0 0 1 3 3v11"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/><path d="M12 10v3.5l2.5 1.5M9.5 3h5"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4.5h8v4a4 4 0 0 1-8 0zM8 6.5H5.5a2.5 2.5 0 0 0 3 3.6M16 6.5h2.5a2.5 2.5 0 0 1-3 3.6M12 12.5V16M9.5 20h5M10.3 16h3.4l.4 4h-4.2z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M15.5 5.6a3.2 3.2 0 0 1 0 5.8M17.5 14.2A5.5 5.5 0 0 1 20.5 19"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-2.7 1.6-4.6 3.3-6.3.3 1.6 1.1 2.7 2.2 3.2C11 8.4 12.4 5.4 15 3c.4 3 1.9 4.6 2.9 6.2a7.4 7.4 0 0 1 .6 5.8c0 3.5-2.6 6-6.5 6z"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4.5 9.5h3l4.5-4v13l-4.5-4h-3z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-turtle" viewBox="0 0 24 24"><path d="M4 15.5h13a3 3 0 0 0 3-3v-.5h-2.5a6 6 0 0 0-11.5 1.5M6.5 15.5l-1 2.5M15 15.5l1 2.5M7 11.5h7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="3"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.8 2.5 5.1 5.6.8-4 4 .9 5.6-5-2.7-5 2.7.9-5.6-4-4 5.6-.8z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4.5 5.5a2 2 0 0 1 2-2h12v14h-12a2 2 0 0 0-2 2zM4.5 19.5a2 2 0 0 0 2 2h12v-4"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".8"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3.5c.6 4.2 2.3 5.9 6.5 6.5-4.2.6-5.9 2.3-6.5 6.5-.6-4.2-2.3-5.9-6.5-6.5 4.2-.6 5.9-2.3 6.5-6.5z"/></symbol>
    <symbol id="i-puzzle" viewBox="0 0 24 24"><path d="M4.5 8.5h4a2 2 0 1 1 4 0h4v4a2 2 0 1 1 0 4v4h-12z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-user-plus" viewBox="0 0 24 24"><circle cx="10" cy="8.5" r="3.4"/><path d="M3.5 19.5a6.5 6.5 0 0 1 13 0M19 8v6M16 11h6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3.5" y="6.5" width="12" height="11" rx="3"/><path d="m15.5 10.5 5-3v9l-5-3z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </defs>
</svg>

<div class="boot" id="boot"><span class="logo-mark"><svg class="icon"><use href="#i-route"/></svg></span></div>

<div class="ob" id="login" hidden>
  <div class="ob-art" style="background:var(--peach)">
    <span class="ob-logo"><span class="logo-mark"><svg class="icon"><use href="#i-route"/></svg></span>Pathway</span>
    <span class="ob-sticker o1">Campus<small>Ejercicios entre clases</small></span>
    <span class="ob-sticker o2">NCLC 7<small>Tu objetivo</small></span>
    <span class="ob-word" aria-hidden="true">Bonjour</span>
  </div>
  <div class="ob-main">
    <div class="ob-top"></div>
    <div class="ob-body"><div class="ob-q" id="loginBox"></div></div>
    <div class="ob-foot"><span class="hint">¿Problemas para entrar? Escríbenos por WhatsApp.</span></div>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="side" aria-label="Campus">
    <a class="logo" href="#"><span class="logo-mark"><svg class="icon"><use href="#i-route"/></svg></span>Pathway</a>
    <nav class="nav" id="sideNav"></nav>
    <div class="side-promo" id="promo"></div>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Campus" hidden></nav>

<div class="lesson" id="lesson" hidden role="dialog" aria-modal="true" aria-label="Lección">
  <div class="l-top">
    <button type="button" class="round" id="lessonClose" aria-label="Salir de la lección"><svg class="icon"><use href="#i-x"/></svg></button>
    <div class="progress" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" id="lessonProgress"><i></i></div>
    <div class="combo" id="combo" aria-live="polite"></div>
  </div>
  <div class="l-body" id="lessonBody"></div>
  <div class="l-foot" id="lessonFoot"><div class="foot-in" id="footIn"></div></div>
</div>

<div class="contract" id="contract" hidden role="dialog" aria-modal="true" aria-label="Compromiso del alumno"></div>
<div class="ob" id="ob" hidden role="dialog" aria-modal="true" aria-label="Bienvenida al campus">
  <div class="ob-art" id="obArt"></div>
  <div class="ob-main">
    <div class="ob-top">
      <button type="button" class="round" id="obBack" aria-label="Atrás"><svg class="icon" style="transform:rotate(180deg)"><use href="#i-arrow"/></svg></button>
      <div class="ob-steps" id="obSteps" aria-hidden="true"></div>
    </div>
    <div class="ob-body" id="obBody"></div>
    <div class="ob-foot" id="obFoot"></div>
  </div>
</div>


<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
<script src="tour.js" defer></script>
</body>
</html>
