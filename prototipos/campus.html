<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Campus Pathway</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Outfit:wght@400..700&display=swap">
<style>
/* Layout: app shell (sidebar on desktop, bottom tabs on phone) + full-screen lesson player. Tokens follow the Pathway V4 identity. */
:root {
  --bg: #f5efe4;
  --surface: #fffaf2;
  --surface-2: #ece4d5;
  --ink: #122b26;
  --on-ink: #fffaf2;
  --muted: #50625c;
  --line: #ddd6c9;
  --sage: #cad8c3;
  --sage-wash: #e6ebdf;
  --accent: #a34e3b;
  --on-accent: #fffaf2;
  --accent-soft: #f4dfd5;
  --good: #246348;
  --good-soft: #d8eadc;
  --warn: #8a5a10;
  --warn-soft: #f5e5c6;
  --flame: #d4692a;
  --shadow: 0 1px 0 rgb(18 43 38 / 5%), 0 10px 28px -16px rgb(18 43 38 / 28%);
  --display: 'Outfit', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --body: 'DM Sans', 'Helvetica Neue', Arial, system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1916; --surface: #132420; --surface-2: #1b302a; --ink: #ece5d7; --on-ink: #0d1916;
    --muted: #9eb0a7; --line: #263c35; --sage: #36574a; --sage-wash: #172b25; --accent: #e8906f;
    --on-accent: #1d0f0a; --accent-soft: #3b2219; --good: #76c79e; --good-soft: #15342a;
    --warn: #e5b562; --warn-soft: #382a12; --flame: #f29a55; --shadow: 0 0 0 1px #263c35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1916; --surface: #132420; --surface-2: #1b302a; --ink: #ece5d7; --on-ink: #0d1916;
  --muted: #9eb0a7; --line: #263c35; --sage: #36574a; --sage-wash: #172b25; --accent: #e8906f;
  --on-accent: #1d0f0a; --accent-soft: #3b2219; --good: #76c79e; --good-soft: #15342a;
  --warn: #e5b562; --warn-soft: #382a12; --flame: #f29a55; --shadow: 0 0 0 1px #263c35;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body.no-scroll { overflow: hidden; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 600; letter-spacing: -.025em; text-wrap: balance; line-height: 1.15; }
p { text-wrap: pretty; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
.icon { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* Demo strip */
.demo-bar { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding-block: 12px; font-size: 13px; color: var(--muted); border-bottom: 1px dashed var(--line); }
.demo-bar strong { color: var(--ink); font-weight: 600; }
.demo-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.segmented { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); }
.segmented button { padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted); transition: background .2s, color .2s; }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.link-btn { font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.link-btn:hover { color: var(--accent); }

/* Shell */
.app { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; padding-block: 24px 120px; }
.sidebar { display: none; }
@media (min-width: 960px) {
  .app { grid-template-columns: 224px minmax(0, 1fr); padding-block: 28px 64px; }
  .sidebar { display: flex; flex-direction: column; gap: 28px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; min-height: calc(100vh - 120px); }
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 21px; letter-spacing: -.03em; text-decoration: none; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--ink); color: var(--on-ink); }
.brand-mark .icon { width: 20px; height: 20px; }
.brand small { display: block; font: 500 12px/1.2 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.nav { display: grid; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 15px; transition: background .15s, color .15s; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.count { margin-left: auto; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; text-align: center; }
.me { margin-top: auto; display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.me b { display: block; font-size: 14px; }
.me span { font-size: 12px; color: var(--muted); }
.avatar { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--sage); color: var(--ink); font: 700 14px var(--display); }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 600; color: var(--muted); text-decoration: none; position: relative; }
.tabbar a[aria-current="page"] { color: var(--accent); }
.tabbar .dot { position: absolute; top: 2px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 10px; line-height: 16px; text-align: center; }
@media (min-width: 960px) { .tabbar { display: none; } }

/* Views */
.view { display: grid; gap: 24px; min-width: 0; animation: rise .4s var(--ease) both; }
@keyframes rise { from { transform: translateY(8px); } }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.page-head h1 { font-size: clamp(28px, 3.4vw, 40px); }
.page-head p { color: var(--muted); max-width: 60ch; margin-top: 6px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.grid > * { grid-column: span 12; min-width: 0; }
@media (min-width: 760px) {
  .span-7 { grid-column: span 7; } .span-5 { grid-column: span 5; }
  .span-6 { grid-column: span 6; } .span-4 { grid-column: span 4; } .span-8 { grid-column: span 8; }
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.card h2 { font-size: 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12px; }
.stack { display: grid; gap: 16px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip .icon { width: 14px; height: 14px; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--accent-soft); color: var(--accent); }
.example-note { font-size: 12px; color: var(--muted); font-style: italic; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 12px 20px; border-radius: 12px; font-weight: 600; font-size: 15px; text-decoration: none; border: 1.5px solid transparent; transition: transform .12s, background .15s, opacity .15s; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.btn-ink { background: var(--ink); color: var(--on-ink); }
.btn-accent { background: var(--accent); color: var(--on-accent); box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.btn-accent:active { box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 55%, #000); transform: translateY(2px); }
.btn-good { background: var(--good); color: var(--on-ink); box-shadow: 0 3px 0 color-mix(in srgb, var(--good) 55%, #000); }
.btn-ghost { border-color: var(--line); background: var(--surface); }
.btn-ghost:hover { border-color: color-mix(in srgb, var(--ink) 35%, var(--line)); }
.btn-sm { min-height: 38px; padding: 8px 14px; font-size: 14px; border-radius: 10px; }

/* Home: today card */
.today { position: relative; overflow: hidden; background: var(--ink); color: var(--on-ink); border: 0; padding: 26px; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); align-content: center; }
@media (min-width: 1100px) { .today { grid-template-columns: minmax(0, 1fr) auto; align-items: center; } }
.today .chip { background: color-mix(in srgb, var(--on-ink) 14%, transparent); color: var(--on-ink); }
.today h2 { font-size: clamp(26px, 3vw, 34px); margin-top: 12px; }
.today p { opacity: .78; margin-top: 6px; }
.today .row { margin-top: 16px; }
.conj { font-family: var(--display); font-size: 15px; line-height: 1.75; padding: 14px 18px; border-radius: 14px; background: color-mix(in srgb, var(--on-ink) 8%, transparent); white-space: nowrap; }
.conj div { display: flex; gap: 10px; }
.conj span:first-child { width: 4.2em; opacity: .6; }
.conj em { font-style: normal; color: var(--flame); font-weight: 600; }
.done-banner { display: flex; align-items: center; gap: 10px; font-weight: 600; }

/* Streak + goal */
.streak { display: grid; gap: 14px; }
.streak-top { display: flex; align-items: center; gap: 14px; }
.flame { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: color-mix(in srgb, var(--flame) 16%, var(--surface)); color: var(--flame); }
.flame .icon { width: 30px; height: 30px; fill: color-mix(in srgb, var(--flame) 30%, transparent); }
.flame.pop { animation: pop .7s var(--ease); }
@keyframes pop { 40% { transform: scale(1.25) rotate(-6deg); } }
.big-num { font: 700 34px/1 var(--display); letter-spacing: -.03em; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); }
.week i { display: block; margin: 4px auto 0; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }
.week i.on { background: var(--flame); color: var(--on-accent); }
.week i.is-today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--flame); }
.week .icon { width: 14px; height: 14px; stroke-width: 2.4; }
.goal { display: flex; align-items: center; gap: 16px; }
.ring { width: 76px; height: 76px; flex: none; }
.ring circle { fill: none; stroke-width: 9; }
.ring .track { stroke: var(--surface-2); }
.ring .val { stroke: var(--good); stroke-linecap: round; transition: stroke-dashoffset .8s var(--ease); transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring text { fill: var(--ink); font: 700 17px var(--display); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--good); transition: width .8s var(--ease); }
.bar.accent i { background: var(--accent); }
.bar.flame i { background: var(--flame); }

/* Route to NCLC 7 */
.track { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin-top: 8px; }
.stop { position: relative; display: grid; justify-items: center; gap: 8px; text-align: center; font-size: 13px; }
.stop::before { content: ''; position: absolute; top: 19px; left: -50%; width: 100%; height: 4px; background: var(--surface-2); z-index: 0; }
.stop:first-child::before { display: none; }
.stop.done::before, .stop.current::before { background: var(--good); }
.stop b { position: relative; z-index: 1; width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font: 700 14px var(--display); background: var(--surface-2); color: var(--muted); }
.stop.done b { background: var(--good); color: var(--on-ink); }
.stop.current b { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 3px var(--good); }
.stop.goal b { background: var(--accent-soft); color: var(--accent); }
.stop span { color: var(--muted); line-height: 1.3; }
.stop.current span { color: var(--ink); font-weight: 600; }

/* Ruta */
.level-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.level-tabs button { display: inline-flex; gap: 8px; align-items: center; padding: 8px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; }
.level-tabs button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--on-ink); }
.level-tabs .icon { width: 16px; height: 16px; }
.route-layout { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .route-layout { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; } .route-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); } }
.segment { display: grid; gap: 6px; }
.seg-head { display: flex; gap: 14px; align-items: flex-start; }
.seg-letter { width: 44px; height: 44px; flex: none; border-radius: 14px; display: grid; place-items: center; font: 700 20px var(--display); background: var(--sage); color: var(--ink); }
.segment.locked .seg-letter { background: var(--surface-2); color: var(--muted); }
.path { display: grid; justify-items: center; gap: 14px; padding: 24px 0 8px; }
.node { --x: 0px; transform: translateX(var(--x)); position: relative; width: 66px; height: 66px; border-radius: 22px; display: grid; place-items: center; font: 700 19px var(--display); background: var(--surface-2); color: var(--muted); border-bottom: 5px solid color-mix(in srgb, var(--surface-2) 70%, var(--ink)); transition: transform .15s; }
.node .icon { width: 24px; height: 24px; }
.node.done { background: var(--good); color: var(--on-ink); border-bottom-color: color-mix(in srgb, var(--good) 60%, #000); }
.node.current { background: var(--accent); color: var(--on-accent); border-bottom-color: color-mix(in srgb, var(--accent) 60%, #000); }
.node.current::after { content: ''; position: absolute; inset: -9px; border-radius: 28px; border: 3px solid var(--accent); opacity: .35; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.92); opacity: .5; } 100% { transform: scale(1.12); opacity: 0; } }
.node.exam { width: 78px; height: 78px; border-radius: 26px; background: var(--warn-soft); color: var(--warn); border-bottom-color: color-mix(in srgb, var(--warn) 45%, var(--warn-soft)); }
.node:hover { transform: translateX(var(--x)) translateY(-2px); }
.node-label { position: absolute; left: calc(100% + 14px); top: 50%; transform: translateY(-50%); white-space: nowrap; font: 600 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); padding: 6px 10px; border-radius: 10px; box-shadow: var(--shadow); }
.locked-segs { display: grid; gap: 12px; }

/* Review */
.review-layout { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .review-layout { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; } }
.flash-wrap { perspective: 1400px; }
.flash { position: relative; min-height: 280px; transform-style: preserve-3d; transition: transform .55s var(--ease); cursor: pointer; }
.flash.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; align-content: center; justify-items: center; gap: 12px; padding: 28px; text-align: center; }
.face.back { transform: rotateY(180deg); background: var(--sage-wash); }
.face .term { font: 600 clamp(26px, 4vw, 36px)/1.2 var(--display); letter-spacing: -.02em; }
.face .term.err { text-decoration: line-through; text-decoration-color: var(--accent); text-decoration-thickness: 2px; }
.face .hint { font-size: 13px; color: var(--muted); }
.face .chip { position: absolute; top: 16px; left: 16px; }
.face .speak { position: absolute; top: 12px; right: 12px; }
.rate { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.rate button { display: grid; gap: 2px; padding: 10px 6px; border-radius: 12px; border: 1.5px solid var(--line); border-bottom-width: 3px; background: var(--surface); font-weight: 600; font-size: 14px; }
.rate button small { font-weight: 500; color: var(--muted); font-size: 12px; }
.rate button:nth-child(1) { color: var(--accent); }
.rate button:nth-child(4) { color: var(--good); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.forecast { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 90px; margin-top: 12px; }
.forecast div { display: grid; gap: 4px; justify-items: center; font-size: 11px; color: var(--muted); align-self: end; }
.forecast i { display: block; width: 100%; border-radius: 6px 6px 3px 3px; background: var(--sage); }
.forecast div:first-child i { background: var(--accent); }

/* Mock exams */
.skill-row { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.skill-row:first-of-type { border-top: 0; }
@media (max-width: 560px) { .skill-row { grid-template-columns: minmax(0, 1fr) auto; } .skill-row .scale { grid-column: 1 / -1; } }
.scale { position: relative; height: 12px; border-radius: 99px; background: var(--surface-2); }
.scale i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--good); }
.scale .target { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--accent); }
.scale .target::after { content: 'NCLC 7'; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.nclc { font: 700 18px var(--display); min-width: 3.4em; text-align: right; }
.exam-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.exam-card { display: grid; gap: 10px; align-content: start; }
.exam-card .icon-tile { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--sage-wash); color: var(--good); }

/* Achievements */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.badge { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 18px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
.badge .medal { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 -4px 0 color-mix(in srgb, var(--warn) 25%, transparent); }
.badge .medal .icon { width: 28px; height: 28px; }
.badge b { font-size: 14px; line-height: 1.25; }
.badge span { font-size: 12px; color: var(--muted); line-height: 1.35; }
.badge.locked .medal { background: var(--surface-2); color: var(--muted); box-shadow: none; }
.badge.locked b { color: var(--muted); }
.badge.new { animation: pop .8s var(--ease); border-color: var(--warn); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 600 11px var(--body); }
.chart .lbl { fill: var(--ink); font: 700 11px var(--body); }

const levelInfo = xp => {
  let lvl = 1, need = 80, acc = 0;
  while (xp >= acc + need) { acc += need; lvl++; need = 60 + 20 * lvl; }
  return { lvl, into: xp - acc, need };
};

/* ---------- Toast ---------- */
let toastTimer;
const toast = msg => {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
};

/* ---------- Speech (browser voice for the prototype) ---------- */
let frVoice = null;
const pickVoice = () => {
  try { const vs = speechSynthesis.getVoices(); frVoice = vs.find(v => /^fr[-_]FR/i.test(v.lang)) || vs.find(v => /^fr/i.test(v.lang)) || null; } catch (e) {}
};
const canSpeak = 'speechSynthesis' in window;
if (canSpeak) { pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {} }
const speak = (text, rate = .92, btn) => {
  if (!canSpeak) return false;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR'; u.rate = rate; if (frVoice) u.voice = frVoice;
    if (btn) { btn.classList.add('speaking'); u.onend = u.onerror = () => btn.classList.remove('speaking'); }
    speechSynthesis.speak(u); return true;
  } catch (e) { return false; }
};

function viewLogros() {
  const li = levelInfo(S.xp);
  const vals = [...S.last7, S.todayXp];
  const days = ['Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom', 'Lun', 'Hoy'].slice(-vals.length);
  const W = 560, H = 200, pad = 28, top = 22, maxV = 100;
  const bw = (W - pad * 2) / vals.length;
  const y = v => H - pad - (v / maxV) * (H - pad - top);
  const bars = vals.map((v, i) => {
    const x = pad + i * bw + bw * .2, w = bw * .6, yy = y(v);
    const cls = i === vals.length - 1 ? 'today' : v >= S.goal ? 'hit' : '';
    return `<rect class="b ${cls}" x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${w.toFixed(1)}" height="${(H - pad - yy).toFixed(1)}" rx="5"/>
      <text class="lbl num" x="${(x + w / 2).toFixed(1)}" y="${(yy - 6).toFixed(1)}" text-anchor="middle">${v}</text>
      <text x="${(x + w / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${days[i]}</text>`;
  }).join('');
  const chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="XP de los últimos 8 días">
    <line class="gridline" x1="${pad}" x2="${W - pad}" y1="${H - pad}" y2="${H - pad}"/>
    <line class="goal-line" x1="${pad}" x2="${W - pad}" y1="${y(S.goal)}" y2="${y(S.goal)}"/>
    <text x="${W - pad}" y="${y(S.goal) - 6}" text-anchor="end" style="fill:var(--accent)">Meta ${S.goal} XP</text>${bars}</svg>`;
  return `<section class="view" aria-labelledby="h-log">
    <header class="page-head"><div><p class="eyebrow">Tu progreso</p><h1 id="h-log">Logros</h1><p>Las insignias marcan pasos reales hacia tu examen, no solo tiempo en la app.</p></div></header>

      </article>
      <article class="card span-4"><p class="eyebrow">Mejor racha</p><p class="big-num num" style="margin-top:8px">21 días</p><p class="small muted">Racha actual: ${S.streak} días</p></article>
      <article class="card span-4"><p class="eyebrow">Lecciones</p><p class="big-num num" style="margin-top:8px">${S.lessonsTotal}</p><p class="small muted num">${S.perfect} sin ningún error</p></article>
      <article class="card"><div class="card-head"><h2>XP por día</h2><span class="chip">Verde: meta cumplida</span></div>${chart}</article>
    </div>
    <div class="card"><div class="card-head"><h2>Insignias</h2><span class="chip num">${S.badges.length} / ${BADGES.length}</span></div>
      <div class="badges">${BADGES.map(b => {
        const has = S.badges.includes(b.id);
        return `<div class="badge ${has ? '' : 'locked'} ${S.newBadges.includes(b.id) ? 'new' : ''}"><span class="medal">${icon(has ? b.icon : 'lock')}</span><b>${b.name}</b><span>${b.desc}</span></div>`;
      }).join('')}</div>
    </div>
  </section>`;
}

const VIEWS = { inicio: viewInicio, ruta: viewRuta, repasar: viewRepasar, simulacros: viewSimulacros, logros: viewLogros, profesor: viewProfesor };

function route() {
  let id = (location.hash || '').slice(1);
  if (!VIEWS[id]) id = S.mode === 'profesor' ? 'profesor' : 'inicio';
  if (id === 'profesor' && S.mode !== 'profesor') { S.mode = 'profesor'; save(); }
  if (id !== 'profesor' && S.mode === 'profesor') { S.mode = 'alumno'; save(); }
  renderNav(id);
  $('#main').innerHTML = VIEWS[id]();
  if (id === 'logros' && S.newBadges.length) { S.newBadges = []; save(); }
  window.scrollTo({ top: 0 });
}
window.addEventListener('hashchange', () => { rv.flipped = false; route(); });

/* ---------- Global clicks ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-start],[data-toast],[data-unit],[data-say],[data-rate],#flash');
  if (!t) return;
  if (t.matches('[data-say]')) { e.stopPropagation(); if (!speak(t.dataset.say, .9, t)) toast('Tu navegador no tiene voz francesa. En la plataforma, el audio lo graban los profesores.'); return; }
  if (t.matches('[data-start]')) return startLesson();
  if (t.matches('[data-toast]')) return toast(t.dataset.toast);
  if (t.matches('[data-unit]')) {
    const u = t.dataset.unit;
    if (u === '1') return startLesson();
    if (u === 'exam') return toast(`${A2.exam.title}: se desbloquea al terminar las 16 unidades del segmento A.`);
    return toast(u === '2' && S.lessonDone ? 'La unidad 2 se construirá en la fase 1. En este prototipo solo la unidad 1 es jugable.' : `La unidad ${u} se desbloquea al terminar la anterior.`);
  }
  if (t.matches('[data-rate]')) return rateCard(+t.dataset.rate);
  if (t.id === 'flash') return flipCard();
});

document.addEventListener('submit', e => {
  if (e.target.id === 'errForm') {
    e.preventDefault();
    const who = $('#errStudent').value, wrong = $('#errWrong').value.trim(), right = $('#errRight').value.trim(), why = $('#errWhy').value.trim();
    if (!wrong || !right) return;
    if (who.startsWith('Valentina')) {
      S.deck.unshift({ id: 'c' + Date.now(), front: wrong, back: right, ex: why || 'Corrección de tu profesor.', src: 'Error de clase · Ryan', err: true });
      save(); renderNav('profesor');
      toast('Tarjeta añadida al repaso de Valentina. Cambia a la vista Alumno para verla.');
    } else toast(`Tarjeta añadida al repaso de ${who} (demo).`);
    e.target.reset();
  }
  if (e.target.id === 'hwForm') {
    e.preventDefault();
    const n = $$('#hwForm input[type=checkbox]:checked').length;
    toast(n ? `Tarea asignada a ${n} alumno${n > 1 ? 's' : ''} (demo).` : 'Elige al menos un alumno.');
  }
});

/* ---------- Review ---------- */
function flipCard() {
  rv.flipped = !rv.flipped;
  $('#flash')?.classList.toggle('flipped', rv.flipped);
  const r = $('#rate'); if (r) r.hidden = !rv.flipped;
}
function rateCard(score) {
  if (!S.deck.length) return;
  const c = S.deck.shift();
  if (score === 0) S.deck.splice(Math.min(2, S.deck.length), 0, c);
  else { S.reviewedToday++; addXp(2, false); }
  save(); rv.flipped = false; route();
  if (score > 0) toast(score === 1 ? 'Volverá en 6 minutos.' : score === 2 ? 'Volverá mañana.' : 'Volverá en 4 días.');
}

function addXp(n, lessonPart = true) {
  S.xp += n; S.todayXp += n; S.myGroupXp += n; S.groupXp += n;
  let streakUp = false;
  if (!S.doneToday && S.todayXp >= S.goal) { S.doneToday = true; S.streak++; streakUp = true; }
  return streakUp;
}

/* ---------- Lesson player ---------- */
let L = null;
const lessonEl = $('#lesson'), body = $('#lessonBody'), foot = $('#lessonFoot'), footInner = $('#footInner');

function startLesson() {
  L = { queue: LESSON.map((x, i) => ({ ...x, id: i, retry: false })), pos: 0, firstOk: 0, combo: 0, xp: 0, errors: [], start: Date.now(), answer: null, checked: false };
  lessonEl.hidden = false; document.body.classList.add('no-scroll');
  renderEx();
}
function closeLesson() {
  try { speechSynthesis.cancel(); } catch (e) {}
  lessonEl.hidden = true; document.body.classList.remove('no-scroll'); L = null; route();
}
$('#lessonClose').addEventListener('click', () => {
  if (!L || L.finished) return closeLesson();
  const box = document.createElement('div');
  box.className = 'confirm';
  box.innerHTML = `<div class="card"><h3>¿Salir de la lección?</h3><p class="small muted">Perderás el progreso de esta sesión.</p><div class="row" style="justify-content:center"><button class="btn btn-ghost btn-sm" id="stay">Seguir</button><button class="btn btn-ink btn-sm" id="leave">Salir</button></div></div>`;
  lessonEl.appendChild(box);
  $('#stay', box).focus();
  $('#stay', box).onclick = () => box.remove();
  $('#leave', box).onclick = () => { box.remove(); closeLesson(); };
});

const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.toLowerCase().replace(/[’`´]/g, "'").replace(/[.!?¿¡,;:]+/g, '').replace(/\s+/g, ' ').trim();
const noAccent = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');

function setProgress() {
  const pct = L.pos / L.queue.length * 100;
  const p = $('#lessonProgress'); p.firstElementChild.style.width = pct + '%'; p.setAttribute('aria-valuenow', Math.round(pct));
  const c = $('#combo');
  c.innerHTML = L.combo >= 2 ? `${icon('flame')}×${L.combo}` : '';
}
function setFoot(mode, data = {}) {
  foot.className = 'lesson-foot' + (mode === 'good' ? ' is-good' : mode === 'bad' ? ' is-bad' : '');
  if (mode === 'check') {
    footInner.innerHTML = `<button class="btn btn-ghost" id="skipBtn" type="button">No lo sé</button><button class="btn btn-accent" id="checkBtn" type="button" disabled>Comprobar</button>`;
    $('#checkBtn').onclick = check; $('#skipBtn').onclick = () => check(true);
  } else if (mode === 'none') {
    footInner.innerHTML = `<p class="small muted">Toca un pronombre y después su forma.</p>`;
  } else if (mode === 'end') {
    footInner.innerHTML = `<a class="btn btn-ghost" href="#repasar" id="toReview">Ver mi repaso</a><button class="btn btn-accent" id="endBtn" type="button">Continuar</button>`;
    $('#endBtn').onclick = closeLesson; $('#toReview').onclick = () => { closeLesson(); };
  } else {
    const good = mode === 'good';
    footInner.innerHTML = `<div class="feedback" role="status"><span class="fb-icon">${icon(good ? 'check' : 'x')}</span><div>
      <h3>${esc(data.title)}</h3>${!good && data.correct ? `<p class="correct">${esc(data.correct)}</p>` : ''}${data.explain ? `<p>${data.explain}</p>` : ''}</div></div>
      <button class="btn ${good ? 'btn-good' : 'btn-accent'}" id="nextBtn" type="button">Continuar</button>`;
    $('#nextBtn').onclick = next; $('#nextBtn').focus();
  }
}
const enableCheck = on => { const b = $('#checkBtn'); if (b) b.disabled = !on; };

function renderEx() {
  setProgress();
  const ex = L.queue[L.pos];
  L.answer = null; L.checked = false;
  const kind = `<p class="ex-kind">${icon(ex.type === 'listen' || ex.type === 'dictation' ? 'speaker' : ex.type === 'match' ? 'puzzle' : ex.type === 'spot' ? 'search' : 'pen')}${ex.retry ? 'Segunda oportunidad · ' : ''}${ex.kind}</p>`;
  let html = '';
  if (ex.type === 'choice') {
    const sentence = ex.fr ? `<p class="fr">${esc(ex.fr).replace('___', '<span class="blank">&nbsp;</span>')}</p>${ex.es ? `<p class="es">${esc(ex.es)}</p>` : ''}` : '';
    html = `${kind}<h2>${ex.title}</h2>${sentence}<div class="options">${ex.options.map((o, i) => `<button class="opt" type="button" data-opt="${i}" aria-pressed="false"><kbd>${i + 1}</kbd>${esc(o)}</button>`).join('')}</div>`;
  } else if (ex.type === 'listen') {
    html = `${kind}<h2>${ex.title}</h2><div class="listen"><button class="play" type="button" id="playN" aria-label="Escuchar">${icon('speaker')}</button><button class="play slow" type="button" id="playS" aria-label="Escuchar más despacio">${icon('turtle')}</button>
      <span class="small muted">${canSpeak ? 'Escucha las veces que necesites.' : ''}</span></div>
      ${canSpeak ? '' : `<p class="transcript">${esc(ex.audio)}</p>`}
      <p class="fr" style="font-size:22px">${esc(ex.question)}</p>
      <div class="options">${ex.options.map((o, i) => `<button class="opt" type="button" data-opt="${i}" aria-pressed="false"><kbd>${i + 1}</kbd>${esc(o)}</button>`).join('')}</div>`;
  } else if (ex.type === 'type') {
    html = `${kind}<h2>${ex.title}</h2><div class="type-line fr"><span>${esc(ex.before)}</span><input class="inline-input" id="typeIn" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Verbo conjugado"><span>${esc(ex.after)}</span></div>
      <p class="es">Verbo: <b>${esc(ex.hint)}</b></p>`;
  } else if (ex.type === 'dictation') {
    html = `${kind}<h2>${ex.title}</h2><div class="listen"><button class="play" type="button" id="playN" aria-label="Escuchar">${icon('speaker')}</button><button class="play slow" type="button" id="playS" aria-label="Escuchar más despacio">${icon('turtle')}</button></div>
      ${canSpeak ? '' : `<p class="transcript">Sin voz francesa en este navegador: escribe en francés «${esc(ex.es)}».</p>`}
      <textarea class="answer-area" id="typeIn" rows="2" autocomplete="off" autocapitalize="sentences" spellcheck="false" aria-label="Tu respuesta" placeholder="Escribe en francés"></textarea>
      <div class="keys" aria-label="Caracteres franceses">${['é', 'è', 'ê', 'à', 'ç', 'ù', "'"].map(k => `<button type="button" data-key="${k}">${k}</button>`).join('')}</div>`;
  } else if (ex.type === 'order') {
    html = `${kind}<h2>${ex.title}</h2><p class="es" style="font-size:18px">«${esc(ex.es)}»</p><div class="answer-line" id="line" aria-label="Tu frase"></div>
      <div class="tiles" id="bank">${ex.tiles.map((t, i) => `<button class="tile" type="button" data-tile="${i}">${esc(t)}</button>`).join('')}</div>`;
  } else if (ex.type === 'match') {
    const right = shuffle(ex.pairs.map((p, i) => ({ t: p[1], i })));
    html = `${kind}<h2>${ex.title}</h2><div class="match"><div class="match-col">${ex.pairs.map((p, i) => `<button class="opt" type="button" data-l="${i}">${esc(p[0])}</button>`).join('')}</div>
      <div class="match-col">${right.map(r => `<button class="opt" type="button" data-r="${r.i}">${esc(r.t)}</button>`).join('')}</div></div>`;
  } else if (ex.type === 'spot') {
    html = `${kind}<h2>${ex.title}</h2><div class="words">${ex.words.map((w, i) => `<button class="word" type="button" data-w="${i}" aria-pressed="false">${esc(w)}</button>`).join('')}</div>`;
  }
  body.innerHTML = `<div class="ex">${html}</div>`;
  body.scrollTop = 0;
  setFoot(ex.type === 'match' ? 'none' : 'check');
  bindEx(ex);
}

function bindEx(ex) {
  $$('[data-opt]', body).forEach(b => b.onclick = () => {
    if (L.checked) return;
    $$('[data-opt]', body).forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true'); L.answer = +b.dataset.opt; enableCheck(true);
  });
  const pn = $('#playN', body), ps = $('#playS', body);
  if (pn) { pn.onclick = () => { if (!speak(ex.audio, .92, pn)) toast('Tu navegador no tiene voz francesa.'); }; }
  if (ps) { ps.onclick = () => { if (!speak(ex.audio, .62, ps)) toast('Tu navegador no tiene voz francesa.'); }; }
  if (pn && ex.type === 'dictation' && canSpeak) setTimeout(() => speak(ex.audio, .92, pn), 350);
  const ti = $('#typeIn', body);
  if (ti) {
    ti.oninput = () => { L.answer = ti.value; enableCheck(ti.value.trim().length > 0); };
    ti.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (L.answer && L.answer.trim() && !L.checked) check(); } };
    setTimeout(() => ti.focus(), 60);
    $$('[data-key]', body).forEach(k => k.onclick = () => {
      const s = ti.selectionStart ?? ti.value.length, en = ti.selectionEnd ?? ti.value.length;
      ti.value = ti.value.slice(0, s) + k.dataset.key + ti.value.slice(en); ti.focus(); ti.setSelectionRange(s + 1, s + 1); ti.oninput();
    });
  }
  if (ex.type === 'order') {
    L.answer = [];
    const line = $('#line', body);
    const draw = () => {
      line.innerHTML = L.answer.map((ti2, pos) => `<button class="tile" type="button" data-pos="${pos}">${esc(ex.tiles[ti2])}</button>`).join('');
      $$('[data-tile]', body).forEach(b => b.disabled = L.answer.includes(+b.dataset.tile));
      $$('[data-pos]', line).forEach(b => b.onclick = () => { if (L.checked) return; L.answer.splice(+b.dataset.pos, 1); draw(); });
      enableCheck(L.answer.length > 0);
    };
    $$('[data-tile]', body).forEach(b => b.onclick = () => { if (L.checked) return; L.answer.push(+b.dataset.tile); draw(); });
  }
  if (ex.type === 'match') {
    let pickL = null, mistakes = 0, paired = 0;
    const L_ = $$('[data-l]', body), R_ = $$('[data-r]', body);
    L_.forEach(b => b.onclick = () => { if (b.classList.contains('paired')) return; L_.forEach(x => x.classList.remove('picked')); b.classList.add('picked'); pickL = +b.dataset.l; });
    R_.forEach(b => b.onclick = () => {
      if (b.classList.contains('paired') || pickL === null) { if (pickL === null) toast('Elige primero un pronombre.'); return; }
      const lb = L_[pickL];
      if (+b.dataset.r === pickL) {
        lb.classList.remove('picked'); lb.classList.add('paired'); b.classList.add('paired'); lb.disabled = b.disabled = true; pickL = null; paired++;
        if (paired === ex.pairs.length) setTimeout(() => check(false, mistakes), 280);
      } else {
        mistakes++; [b, lb].forEach(x => { x.classList.remove('shake'); void x.offsetWidth; x.classList.add('shake'); });
      }
    });
  }
  if (ex.type === 'spot') {
    $$('[data-w]', body).forEach(b => b.onclick = () => {
      if (L.checked) return;
      $$('[data-w]', body).forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true'); L.answer = +b.dataset.w; enableCheck(true);
    });
  }
}

function correctText(ex) {
  switch (ex.type) {
    case 'choice': return ex.fr ? ex.fr.replace('___', ex.options[ex.answer]) : ex.options[ex.answer];
    case 'listen': return ex.options[ex.answer];
    case 'type': return `${ex.before} ${ex.answers[0]} ${ex.after}`;
    case 'dictation': return ex.audio;
    case 'order': return ex.answer.join(' ');
    case 'spot': return ex.words.map((w, i) => i === ex.wrong ? ex.fix : w).join(' ');
    default: return '';
  }
}
function reviewCard(ex) {
  const back = correctText(ex);
  const front = ex.type === 'choice' && ex.fr ? ex.fr : ex.type === 'type' ? `${ex.before} ___ ${ex.after} (${ex.hint})` : ex.type === 'listen' ? ex.question : ex.type === 'order' || ex.type === 'dictation' ? ex.es : ex.type === 'spot' ? ex.words.join(' ') : ex.title;
  const tmp = document.createElement('div'); tmp.innerHTML = ex.explain || '';
  return { id: 'l' + ex.id, front, back, ex: tmp.textContent, src: 'Error de la unidad 1', err: ex.type === 'spot' };
}

function check(skipped = false, matchMistakes = 0) {
  if (!L || L.checked) return;
  const ex = L.queue[L.pos];
  let ok = false, note = '';
  if (skipped === true) ok = false;
  else if (ex.type === 'choice' || ex.type === 'listen') ok = L.answer === ex.answer;
  else if (ex.type === 'type' || ex.type === 'dictation') {
    const a = norm(L.answer || '');
    ok = ex.answers.some(x => norm(x) === a);
    if (!ok && ex.answers.some(x => noAccent(norm(x)) === noAccent(a))) { ok = true; note = 'Ojo con los acentos: ' + correctText(ex); }
  } else if (ex.type === 'order') ok = L.answer.map(i => ex.tiles[i]).join(' ') === ex.answer.join(' ');
  else if (ex.type === 'spot') ok = L.answer === ex.wrong;
  else if (ex.type === 'match') ok = matchMistakes === 0;
  L.checked = true;

  // mark UI
  if (ex.type === 'choice' || ex.type === 'listen') {
    $$('[data-opt]', body).forEach(b => { const i = +b.dataset.opt; b.disabled = true; if (i === ex.answer) b.classList.add('is-right'); else if (i === L.answer) b.classList.add('is-wrong'); });
    if (ex.type === 'listen') body.querySelector('.ex').insertAdjacentHTML('beforeend', `<p class="transcript">${esc(ex.audio)}</p>`);
  }
  if (ex.type === 'spot') { const w = $$('[data-w]', body)[ex.wrong]; w.classList.add('is-right'); w.textContent = ex.fix; $$('[data-w]', body).forEach(b => b.disabled = true); }
  const ti = $('#typeIn', body); if (ti) ti.disabled = true;

  let gained = 0;
  if (ex.type === 'match' && matchMistakes) { gained = 5; L.combo = 0; }
  else if (ok) {
    L.combo++;
    gained = ex.retry ? 5 : 10 + (L.combo >= 3 ? 2 : 0);
    if (!ex.retry) L.firstOk++;
    const c = $('#combo'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
  } else {
    L.combo = 0;
    if (!ex.retry) { L.queue.push({ ...ex, retry: true }); L.errors.push(ex); }
  }
  L.xp += gained;
  setProgress();
  if (gained) floatXp(gained);
  const titles = ['¡Bien hecho!', '¡Exacto!', '¡Perfecto!', 'Muy bien'];
  if (ex.type === 'match') setFoot('good', { title: matchMistakes ? `Completado con ${matchMistakes} error${matchMistakes > 1 ? 'es' : ''}` : '¡Todo emparejado!', explain: ex.explain });
  else if (ok) setFoot('good', { title: note ? 'Casi perfecto' : L.combo >= 3 ? `${L.combo} seguidas` : titles[Math.floor(Math.random() * titles.length)], explain: note ? esc(note) : ex.explain });
  else setFoot('bad', { title: skipped === true ? 'La respuesta era:' : 'Respuesta correcta:', correct: correctText(ex), explain: ex.explain + (ex.retry ? '' : ' <i>Volverá al final de la lección.</i>') });
}

function floatXp(n) {
  const b = $('#nextBtn') || footInner;
  const r = b.getBoundingClientRect();
  const el = document.createElement('div'); el.className = 'xp-float num'; el.textContent = `+${n} XP`;
  el.style.left = (r.left + r.width / 2 - 28) + 'px'; el.style.top = (r.top - 12) + 'px';
  document.body.appendChild(el); setTimeout(() => el.remove(), 1100);
}

function next() {
  if (!L) return;
  L.pos++;
  if (L.pos >= L.queue.length) return finish();
  renderEx();
}

function finish() {
  L.finished = true;
  $('#lessonProgress').firstElementChild.style.width = '100%';
  $('#combo').innerHTML = '';
  const secs = Math.round((Date.now() - L.start) / 1000);
  const acc = Math.round(L.firstOk / LESSON.length * 100);
  const first = !S.lessonDone;
  const before = S.streak;
  const streakUp = addXp(L.xp);
  const earned = [];
  if (!S.badges.includes('primeros')) earned.push('primeros');
  if (acc === 100 && !S.badges.includes('perfecta')) earned.push('perfecta');
  S.badges.push(...earned); S.newBadges = earned;
  S.lessonDone = true; S.lessonXp = L.xp; S.lessonsTotal++; if (acc === 100) S.perfect++;
  const cards = L.errors.map(reviewCard).filter(c => !S.deck.some(d => d.id === c.id));
  S.deck.push(...cards);
  save();
  const badgeItems = earned.map(id => { const b = BADGES.find(x => x.id === id); return `<div class="end-item"><span class="medal">${icon(b.icon)}</span><div><b>Insignia: ${b.name}</b><br><span class="muted">${b.desc}</span></div></div>`; }).join('');
  body.innerHTML = `<div class="end">
    <p class="ex-kind">${icon('sparkle')} Unidad 1 terminada</p>
    <h2>${acc === 100 ? '¡Lección perfecta!' : acc >= 75 ? '¡Muy buen trabajo!' : 'Lección completada'}</h2>
    <div class="end-stats">
      <div class="xp"><small>XP</small><b class="num" id="xpCount">0</b></div>
      <div class="acc"><small>Aciertos</small><b class="num">${acc} %</b></div>
      <div><small>Tiempo</small><b class="num">${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}</b></div>
    </div>
    <div class="end-list">
      ${streakUp ? `<div class="end-item"><span class="flame pop">${icon('flame')}</span><div><b>Racha: ${before} → ${S.streak} días</b><br><span class="muted">Meta diaria cumplida. Vuelve mañana para seguir.</span></div></div>`
        : `<div class="end-item"><span class="flame">${icon('flame')}</span><div><b class="num">${S.todayXp} / ${S.goal} XP hoy</b><br><span class="muted">${S.doneToday ? 'Meta diaria ya cumplida.' : `Te faltan ${S.goal - S.todayXp} XP para mantener la racha.`}</span></div></div>`}
      ${badgeItems}
      ${cards.length ? `<div class="end-item"><span class="medal" style="background:var(--accent-soft);color:var(--accent)">${icon('cards')}</span><div><b>${cards.length} tarjeta${cards.length > 1 ? 's' : ''} nueva${cards.length > 1 ? 's' : ''} en tu repaso</b><br><span class="muted">Tus errores vuelven a aparecer hasta que los domines.</span></div></div>` : ''}
      ${first ? `<div class="end-item"><span class="medal" style="background:var(--good-soft);color:var(--good)">${icon('check')}</span><div><b>Tarea de Ryan entregada</b><br><span class="muted">Ryan verá tu resultado antes de la clase del jueves.</span></div></div>` : ''}
    </div>
  </div>`;
  setFoot('end');
  countUp($('#xpCount'), L.xp);
  confetti();
}

function countUp(el, to) {
  if (reduced) { el.textContent = '+' + to; return; }
  const t0 = performance.now(), d = 900;
  const step = t => { const p = Math.min(1, (t - t0) / d); el.textContent = '+' + Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function confetti() {
  if (reduced) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--accent', '--good', '--flame', '--sage', '--warn'].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({ length: 150 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, w: 6 + Math.random() * 6, h: 4 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  const frame = t => {
    const el = t - t0; ctx.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.globalAlpha = Math.max(0, 1 - el / 2400); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
    if (el < 2400) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(frame);
}

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', e => {
  if (!lessonEl.hidden && L) {
    if ($('.confirm', lessonEl)) { if (e.key === 'Escape') $('.confirm', lessonEl).remove(); return; }
    if (e.key === 'Escape') { $('#lessonClose').click(); return; }
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'textarea' || tag === 'input') return;
    if (/^[1-4]$/.test(e.key) && !L.checked) { const b = $(`[data-opt="${+e.key - 1}"]`, body); if (b) b.click(); }
    if (e.key === 'Enter') {
      if (e.target.closest && e.target.closest('button') && !e.target.matches('#checkBtn,#nextBtn')) return;
      e.preventDefault();
      const n = $('#nextBtn'); if (n) return n.click();
      const c = $('#checkBtn'); if (c && !c.disabled) return c.click();
      const end = $('#endBtn'); if (end) end.click();
    }
    return;
  }
  if ((location.hash === '#repasar') && S.deck.length) {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.key === ' ') { e.preventDefault(); flipCard(); }
    if (rv.flipped && /^[1-4]$/.test(e.key)) rateCard(+e.key - 1);
  }
});

/* ---------- Mode + reset ---------- */
$('#modeStudent').onclick = () => { S.mode = 'alumno'; save(); location.hash = 'inicio'; };
$('#modeTeacher').onclick = () => { S.mode = 'profesor'; save(); location.hash = 'profesor'; };
$('#resetDemo').onclick = () => { S = fresh(); save(); rv.flipped = false; if (location.hash === '#inicio') route(); else location.hash = 'inicio'; toast('Demo reiniciada.'); };

route();
})();
</script>
