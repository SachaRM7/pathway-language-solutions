<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Campus Pathway</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<style>
/* Layout: floating white sidebar + bento dashboard of pastel tiles on a neutral ground; full-screen lesson player. */
:root {
  --bg: #f2f2f0;
  --panel: #ffffff;
  --ink: #141414;
  --ink-2: #5f5f66;
  --ink-3: #9b9ba3;
  --line: #e8e8ea;
  --soft: #f6f6f5;
  --coral: #f05a36;
  --on-ink: #ffffff;
  --peach: #ffe6db;   --peach-ink: #b23f1d;
  --lilac: #ebe7ff;   --lilac-ink: #5946c8;
  --mint: #dcf3e4;    --mint-ink: #1d7a49;
  --butter: #fff2c4;  --butter-ink: #866000;
  --sky: #e0edff;     --sky-ink: #2d5db0;
  --good: #1f9d5c;
  --shadow: 0 1px 2px rgb(20 20 20 / 4%), 0 16px 40px -24px rgb(20 20 20 / 22%);
  --font: 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --r-xl: 28px;
  --r: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0c0e; --panel: #17171a; --ink: #f4f4f5; --ink-2: #a3a3ab; --ink-3: #6f6f78; --line: #27272b; --soft: #212125;
    --coral: #ff6a45; --on-ink: #0c0c0e;
    --peach: #ffd8c8; --lilac: #ddd6ff; --mint: #c8ecd5; --butter: #ffe9a6; --sky: #cde1ff;
    --shadow: 0 0 0 1px #232327; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0c0e; --panel: #17171a; --ink: #f4f4f5; --ink-2: #a3a3ab; --ink-3: #6f6f78; --line: #27272b; --soft: #212125;
  --coral: #ff6a45; --on-ink: #0c0c0e;
  --peach: #ffd8c8; --lilac: #ddd6ff; --mint: #c8ecd5; --butter: #ffe9a6; --sky: #cde1ff;
  --shadow: 0 0 0 1px #232327; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
/* Pastel surfaces keep dark text in both themes: in dark mode they read as bright cards on a black ground. */
.tile.peach, .tile.lilac, .tile.mint, .tile.butter, .tile.sky, .date-block, .side-promo, .l-foot.good, .l-foot.bad, .end-stats div, .audio-card, .ob-art {
  --ink: #141414; --ink-2: #4b4b52; --ink-3: #77777f; --panel: #ffffff; --on-ink: #ffffff; --soft: #f3f3f2; --line: #e3e3e5;
  color: var(--ink);
}

[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.5 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-font-smoothing: antialiased;
}
body.no-scroll { overflow: hidden; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-weight: 700; letter-spacing: -.035em; line-height: 1.12; text-wrap: balance; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--coral); outline-offset: 3px; border-radius: 12px; }
.icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }

/* Shell */
.app { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; padding-block: 16px 112px; }
.side { display: none; }
@media (min-width: 1000px) {
  .app { grid-template-columns: 236px minmax(0, 1fr); gap: 28px; padding-block: 16px 40px; }
  .side { display: flex; flex-direction: column; gap: 28px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; height: calc(100vh - 32px); padding: 22px 16px; background: var(--panel); border-radius: var(--r-xl); box-shadow: var(--shadow); }
}
.logo { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 800; font-size: 18px; letter-spacing: -.04em; }
.logo-mark { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--coral); color: #fff; }
.logo-mark .icon { width: 19px; height: 19px; stroke-width: 2.2; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px; border-radius: 999px; color: var(--ink-2); font-weight: 600; transition: background .15s, color .15s; }
.nav a:hover { background: var(--soft); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--on-ink); }
.nav .count { margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 99px; display: grid; place-items: center; background: var(--coral); color: #fff; font-size: 11px; font-weight: 700; }
.nav a[aria-current="page"] .count { background: var(--on-ink); color: var(--ink); }
.side-promo { margin-top: auto; padding: 18px; border-radius: var(--r); background: var(--sky); color: var(--sky-ink); display: grid; gap: 6px; }
.side-promo b { color: var(--ink); font-size: 15px; letter-spacing: -.02em; }
.side-promo span { font-size: 13px; }
.side-foot { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 12px; color: var(--ink-3); }
.side-foot button { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.side-foot button:hover { color: var(--coral); }

.tabbar { position: fixed; z-index: 20; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 6px; border-radius: 999px; background: var(--ink); box-shadow: 0 18px 40px -16px rgb(0 0 0 / 45%); }
.tabbar a { position: relative; height: 50px; display: grid; place-items: center; border-radius: 999px; color: color-mix(in srgb, var(--on-ink) 55%, transparent); }
.tabbar a[aria-current="page"] { background: var(--on-ink); color: var(--ink); }
.tabbar .dot { position: absolute; top: 8px; right: calc(50% - 20px); width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
@media (min-width: 1000px) { .tabbar { display: none; } }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px; padding-top: 6px; }
.top h1 { font-size: clamp(26px, 3vw, 34px); }
.top p { color: var(--ink-2); margin-top: 4px; }
.top-tools { display: flex; align-items: center; gap: 10px; }
.search { display: none; align-items: center; gap: 10px; height: 46px; width: 260px; padding: 0 18px; border-radius: 999px; background: var(--panel); color: var(--ink-3); box-shadow: var(--shadow); font-size: 14px; white-space: nowrap; }
@media (min-width: 1180px) { .search { display: flex; } }
.round { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); box-shadow: var(--shadow); color: var(--ink); position: relative; }
.round .pip { position: absolute; top: 12px; right: 13px; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 2px var(--panel); }
.switch { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--panel); box-shadow: var(--shadow); }
.switch button { height: 38px; padding: 0 16px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.switch button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.ava { width: 46px; height: 46px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--lilac); color: var(--lilac-ink); }
.ava.sm { width: 34px; height: 34px; font-size: 12px; }

/* Bento */
.view { display: grid; gap: 20px; min-width: 0; animation: in .45s var(--ease) both; }
@keyframes in { from { transform: translateY(10px); } }
.bento { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.bento > * { grid-column: span 12; min-width: 0; }
@media (min-width: 720px) {
  .c-3 { grid-column: span 6; } .c-4 { grid-column: span 6; } .c-5 { grid-column: span 12; }
  .c-6 { grid-column: span 6; } .c-7 { grid-column: span 12; } .c-8 { grid-column: span 12; }
}
@media (min-width: 1180px) {
  .c-3 { grid-column: span 3; } .c-4 { grid-column: span 4; } .c-5 { grid-column: span 5; }
  .c-7 { grid-column: span 7; } .c-8 { grid-column: span 8; }
}
.tile { position: relative; border-radius: var(--r-xl); padding: 24px; background: var(--panel); box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.tile.peach { background: var(--peach); box-shadow: none; }
.tile.lilac { background: var(--lilac); box-shadow: none; }
.tile.mint { background: var(--mint); box-shadow: none; }
.tile.butter { background: var(--butter); box-shadow: none; }
.tile.sky { background: var(--sky); box-shadow: none; }
.tile-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.tile-head h2 { font-size: 18px; letter-spacing: -.025em; }
.label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.huge { font-size: clamp(48px, 5vw, 64px); font-weight: 800; letter-spacing: -.06em; line-height: .95; }
.big span { margin-left: 4px; letter-spacing: -.02em; }
.big { font-size: 34px; font-weight: 800; letter-spacing: -.05em; line-height: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 700; background: color-mix(in srgb, var(--panel) 70%, transparent); color: var(--ink); white-space: nowrap; }
.pill .icon { width: 14px; height: 14px; stroke-width: 2.2; }
.pill.dark { background: var(--ink); color: var(--on-ink); }
.pill.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 50px; padding: 0 24px; border-radius: 999px; font-weight: 700; font-size: 15px; white-space: nowrap; transition: transform .12s, opacity .15s, background .15s; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .3; cursor: default; transform: none; }
.btn-dark { background: var(--ink); color: var(--on-ink); }
.btn-coral { background: var(--coral); color: #fff; }
.btn-good { background: var(--good); color: #fff; }
.btn-light { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn-light:hover { box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.btn-sm { height: 40px; padding: 0 18px; font-size: 14px; }
.btn .arrow { width: 28px; height: 28px; margin-right: -12px; border-radius: 50%; display: grid; place-items: center; background: var(--on-ink); color: var(--ink); }
.btn .arrow .icon { width: 16px; height: 16px; stroke-width: 2.2; }

/* Hero */
.hero { min-height: 300px; display: grid; align-content: space-between; gap: 28px; padding: 28px; }
.hero h2 { font-size: clamp(28px, 3.2vw, 40px); max-width: 13ch; letter-spacing: -.045em; margin-top: 16px; }
.hero p { color: color-mix(in srgb, var(--peach-ink) 80%, var(--ink)); margin-top: 10px; font-weight: 600; }
.hero-art { position: absolute; right: -10px; bottom: -42px; font-size: clamp(150px, 19vw, 240px); font-weight: 800; letter-spacing: -.08em; line-height: 1; color: var(--coral); pointer-events: none; user-select: none; }
.sticker { position: absolute; padding: 10px 16px; border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); font-weight: 700; font-size: 15px; letter-spacing: -.02em; white-space: nowrap; }
.sticker em { font-style: normal; color: var(--coral); }
.s1 { right: 210px; top: 34px; transform: rotate(-6deg); }
.s2 { right: 40px; top: 82px; transform: rotate(5deg); }
@media (max-width: 719px) { .hero-art { font-size: 130px; bottom: -28px; opacity: .9; } .sticker { display: none; } .hero h2 { max-width: 11ch; } }

/* Streak */
.streak-top { display: flex; align-items: flex-start; justify-content: space-between; }
.flame { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); color: var(--coral); }
.flame .icon { width: 26px; height: 26px; fill: color-mix(in srgb, var(--coral) 25%, transparent); }
@keyframes pop { 40% { transform: scale(1.3) rotate(-8deg); } }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 22px; }
.week div { display: grid; justify-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: color-mix(in srgb, var(--butter-ink) 75%, var(--ink)); }
.week i { width: 100%; max-width: 30px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--panel) 65%, transparent); }
.week i.on { background: var(--ink); color: var(--on-ink); }
.week i.is-today { box-shadow: inset 0 0 0 2px var(--ink); }
.week .icon { width: 13px; height: 13px; stroke-width: 2.6; }

/* Goal ring */
.ring { width: 112px; height: 112px; flex: none; }
.ring circle { fill: none; stroke-width: 12; }
.ring .track { stroke: color-mix(in srgb, var(--panel) 70%, transparent); }
.ring .val { stroke: var(--lilac-ink); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .9s var(--ease); }
.ring text { fill: var(--ink); font: 800 22px var(--font); letter-spacing: -.04em; }
.goal-row { display: flex; align-items: center; gap: 20px; }

/* Level progress */
.levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 8px; align-items: end; }
.lv { display: grid; gap: 10px; }
.lv b { font-size: 14px; }
.lv small { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.lv .track { height: 14px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.lv .track i { display: block; height: 100%; border-radius: inherit; background: var(--ink); }
.lv.cur .track i { background: var(--coral); min-width: 14px; }
.lv-goal { height: 44px; padding: 0 16px; border-radius: 999px; background: var(--mint); color: var(--mint-ink); display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; white-space: nowrap; }
@media (max-width: 560px) { .levels { grid-template-columns: repeat(4, minmax(0, 1fr)); } .lv-goal { grid-column: 1 / -1; justify-content: center; } }

/* Activity chart */
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: end; height: 150px; }
.bars div { display: grid; justify-items: center; gap: 8px; height: 100%; align-content: end; font-size: 12px; font-weight: 700; color: var(--ink-3); }
.bars i { width: 100%; max-width: 34px; border-radius: 12px; background: var(--soft); position: relative; }
.bars i.hit { background: var(--ink); }
.bars i.today { background: var(--coral); }
.bars i span { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--ink-2); font-style: normal; }
.bars div.on { color: var(--ink); }

/* Class tile */
.date-block { width: 72px; height: 76px; border-radius: 20px; background: var(--sky); color: var(--sky-ink); display: grid; place-content: center; text-align: center; flex: none; }
.date-block b { font-size: 28px; font-weight: 800; letter-spacing: -.05em; line-height: 1; color: var(--ink); }
.date-block small { font-size: 11px; font-weight: 800; letter-spacing: .08em; }
.class-row { display: flex; gap: 16px; align-items: center; }
.class-row h3 { font-size: 17px; }
.teacher { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; }
.teacher .ava { background: var(--butter); color: var(--butter-ink); }

/* Challenge */
.dots { display: flex; gap: 6px; margin-top: 14px; }
.dots i { flex: 1; height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--panel) 60%, transparent); }
.dots i.on { background: var(--mint-ink); }
.group { margin-top: 18px; font-size: 13px; color: color-mix(in srgb, var(--mint-ink) 70%, var(--ink)); font-weight: 600; }

/* Route */
.seg-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.seg-tabs button { flex: none; height: 44px; padding: 0 18px 0 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 10px; background: var(--panel); box-shadow: var(--shadow); font-weight: 700; font-size: 14px; color: var(--ink-2); }
.seg-tabs button b { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--ink); font-size: 13px; }
.seg-tabs button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.seg-tabs button[aria-pressed="true"] b { background: var(--coral); color: #fff; }
.unit-hero { display: grid; gap: 22px; padding: 28px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .unit-hero { grid-template-columns: minmax(0, 1fr) 260px; align-items: end; } }
.unit-no { font-size: 88px; font-weight: 800; letter-spacing: -.07em; line-height: .85; color: var(--coral); }
.unit-hero h2 { font-size: clamp(24px, 2.6vw, 32px); margin-top: 14px; max-width: 18ch; }
.unit-meta { display: grid; gap: 10px; }
.unit-meta div { display: flex; justify-content: space-between; gap: 10px; padding: 12px 16px; border-radius: 16px; background: color-mix(in srgb, var(--panel) 70%, transparent); font-size: 14px; font-weight: 600; }
.unit-meta div span { color: color-mix(in srgb, var(--peach-ink) 80%, var(--ink)); }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; }
.u { aspect-ratio: 1; border-radius: 20px; display: grid; place-items: center; font-weight: 800; font-size: 18px; letter-spacing: -.03em; background: var(--soft); color: var(--ink-3); transition: transform .15s; }
.u:hover { transform: translateY(-2px); }
.u.done { background: var(--ink); color: var(--on-ink); }
.u.cur { background: var(--coral); color: #fff; box-shadow: 0 10px 24px -10px var(--coral); }
.u.exam { background: var(--butter); color: var(--butter-ink); }
.u .icon { width: 18px; height: 18px; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; }

/* Review */
.review { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { .review { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; } }
.stage { padding: clamp(20px, 4vw, 44px); display: grid; gap: 20px; }
.flash-wrap { perspective: 1400px; }
.flash { position: relative; min-height: 300px; transform-style: preserve-3d; transition: transform .6s var(--ease); cursor: pointer; }
.flash.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 26px; background: var(--panel); box-shadow: 0 30px 60px -30px rgb(40 30 90 / 35%); display: grid; align-content: center; justify-items: center; gap: 12px; padding: 32px 24px; text-align: center; }
.face.back { transform: rotateY(180deg); }
.face .term { font-size: clamp(28px, 4.4vw, 44px); font-weight: 800; letter-spacing: -.045em; line-height: 1.1; }
.face .term.err { text-decoration: line-through; text-decoration-color: var(--coral); text-decoration-thickness: 3px; }
.face .hint { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.face .pill { position: absolute; top: 18px; left: 18px; background: var(--soft); }
.face .pill.err { background: var(--peach); color: var(--peach-ink); }
.face .speak { position: absolute; top: 12px; right: 12px; box-shadow: none; background: var(--soft); }
.rate { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rate button { height: 60px; border-radius: 18px; background: var(--panel); display: grid; place-content: center; gap: 2px; font-weight: 700; font-size: 14px; }
.rate button small { font-size: 11px; font-weight: 600; color: var(--ink-3); }
.rate button:hover { background: var(--soft); }
.rate button:first-child { color: var(--coral); }
.mini-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 110px; margin-top: 8px; }
.mini-bars div { display: grid; justify-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--ink-3); align-self: end; }
.mini-bars i { width: 100%; border-radius: 8px; background: var(--lilac); }
.mini-bars div:first-child i { background: var(--coral); }
.mini-bars div:first-child { color: var(--ink); }

/* Mock exams */
.exam-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.exam { display: grid; gap: 18px; align-content: space-between; min-height: 260px; }

function route() {
  let id = location.hash.slice(1);
  if (!VIEWS[id]) id = S.mode === 'profesor' ? 'profesor' : 'inicio';
  const m = id === 'profesor' ? 'profesor' : 'alumno';
  if (S.mode !== m) { S.mode = m; save(); }
  renderNav(id);
  $('#main').innerHTML = VIEWS[id]();
  if (id === 'logros' && S.newBadges.length) { S.newBadges = []; save(); }
  window.scrollTo({ top: 0 });
}
window.addEventListener('hashchange', () => { flipped = false; route(); });

document.addEventListener('click', e => {
  const t = e.target.closest('[data-start],[data-toast],[data-unit],[data-say],[data-rate],[data-seg],[data-exam],[data-mode],#flash');
  if (!t) return;
  if (t.matches('[data-say]')) { e.stopPropagation(); if (!speak(t.dataset.say, .9, t)) toast('Este navegador no tiene voz francesa. En la plataforma, el audio lo graban los profesores.'); return; }
  if (t.matches('[data-mode]')) { location.hash = t.dataset.mode === 'profesor' ? 'profesor' : 'inicio'; return; }
  if (t.matches('[data-start]')) return startLesson();
  if (t.matches('[data-toast]')) return toast(t.dataset.toast);
  if (t.matches('[data-exam]')) { simExam = t.dataset.exam; $('#main').innerHTML = viewSimulacros(); return; }
  if (t.matches('[data-seg]')) { seg = +t.dataset.seg; $('#main').innerHTML = viewRuta(); return; }
  if (t.matches('[data-unit]')) {
    const u = t.dataset.unit;
    if (u === '1') return startLesson();
    if (u === 'exam') return toast(seg === 0 ? `${A2.exam.title} · ${A2.exam.time}. Se desbloquea al terminar las 16 unidades.` : 'Se desbloquea al terminar el segmento.');
    return toast(u === '2' && S.lessonDone ? 'La unidad 2 llega en la fase 1. En el prototipo solo se juega la unidad 1.' : `La unidad ${u} se desbloquea al terminar la anterior.`);
  }
  if (t.matches('[data-rate]')) return rate(+t.dataset.rate);
  if (t.id === 'flash') return flip();
});
document.addEventListener('submit', e => {
  if (e.target.id === 'errForm') {
    e.preventDefault();
    const who = $('#errStudent').value, w = $('#errWrong').value.trim(), r = $('#errRight').value.trim(), why = $('#errWhy').value.trim();
    if (!w || !r) return;
    if (who.startsWith('Valentina')) { S.deck.unshift({ id: 'c' + Date.now(), front: w, back: r, ex: why || 'Corrección de tu profesor.', src: 'Error de clase · Ryan', err: true }); save(); toast('Añadida al repaso de Valentina. Cambia a la vista Alumno para verla.'); }
    else toast(`Añadida al repaso de ${who} (demo).`);
    e.target.reset();
  }
  if (e.target.id === 'hwForm') { e.preventDefault(); const n = $$('#hwForm input[type=checkbox]:checked').length; toast(n ? `Tarea asignada a ${n} alumno${n > 1 ? 's' : ''} (demo).` : 'Elige al menos un alumno.'); }
});

function flip() { flipped = !flipped; $('#flash')?.classList.toggle('flipped', flipped); const r = $('#rate'); if (r) r.hidden = !flipped; }
function rate(score) {
  if (!S.deck.length) return;
  const c = S.deck.shift();
  if (score === 0) S.deck.splice(Math.min(2, S.deck.length), 0, c); else { S.reviewed++; addXp(2); }
  save(); flipped = false; route();
  if (score > 0) toast(['', 'Volverá en 6 minutos.', 'Volverá mañana.', 'Volverá en 4 días.'][score]);
}
function addXp(n) {
  S.xp += n; S.todayXp += n; S.groupXp += n;
  if (!S.doneToday && S.todayXp >= S.goal) { S.doneToday = true; S.streak++; return true; }
  return false;
}

let L = null;

function startLesson() {

$('#lessonClose').addEventListener('click', () => {
  if (!L || L.finished) return closeLesson();
  const box = document.createElement('div'); box.className = 'confirm';
  box.innerHTML = `<div class="tile"><h3 style="font-size:22px">¿Salir de la lección?</h3><p class="muted">Perderás el progreso de esta sesión.</p><div class="acts"><button class="btn btn-light btn-sm" id="stay">Seguir</button><button class="btn btn-dark btn-sm" id="leave">Salir</button></div></div>`;

let ob = { i: 0, p: {} };
const obEl = $('#ob');
function openOnboarding() {
  ob = { i: 0, p: { nivel: 'A2', recordatorio: 'noche', canal: 'whatsapp', ...(S.profile || {}) } };
  obEl.hidden = false; document.body.classList.add('no-scroll'); renderOb();
}
function obWord(step) {
  if (step.id === 'fecha' && ob.p.fecha && ob.p.fecha !== 'nose') { const [y, m] = ob.p.fecha.split('-'); return `${MONTHS[+m - 1]} ${y.slice(2)}`; }
  if (step.id === 'nivel') return ob.p.nivel || 'A2';
  if (step.id === 'ritmo' && ob.p.goal) return RITMOS[ob.p.goal].replace(' al día', '');
  if (step.id === 'examen' && ob.p.examen === 'tef') return 'TEF';
  if (step.id === 'examen' && ob.p.examen === 'tcf') return 'TCF';
  return step.word;
}
function obReady(step) { return !step.key || step.key === 'nivel' || ob.p[step.key] != null; }
function renderOb() {
  const step = OB[ob.i];
  const art = $('#obArt');
  art.style.background = `var(--${step.c})`;
  art.innerHTML = `<span class="ob-logo"><span class="logo-mark"><svg class="icon"><use href="#i-route"/></svg></span>Pathway</span>
    ${step.st.map((s, i) => `<span class="ob-sticker o${i + 1}">${esc(s[0])}<small>${esc(s[1])}</small></span>`).join('')}
    <span class="ob-word" aria-hidden="true">${esc(obWord(step))}</span>`;
  $('#obSteps').innerHTML = OB.map((_, i) => `<i class="${i <= ob.i ? 'on' : ''}"></i>`).join('');
  $('#obBack').disabled = ob.i === 0;
  let h = '';
  if (step.id === 'hola') {
    h = `<h1>Hola, Valentina</h1><p class="sub">Ryan te invitó al campus de Pathway: ejercicios, repaso y simulacros entre tus clases. Dos minutos para preparar tu plan.</p>
      <div class="plan"><div><span>Tu profesor</span><b>Ryan</b></div><div><span>Tus clases</span><b>Martes y jueves · 18:00</b></div></div>`;
  } else if (step.opts) {
    h = `<h1>${step.title}</h1><p class="sub">${step.sub}</p><div class="choices" role="radiogroup">${step.opts.map(o => `<button type="button" class="choice" role="radio" data-ob="${step.key}" data-v="${o.v}" aria-pressed="${String(ob.p[step.key]) === String(o.v)}" aria-checked="${String(ob.p[step.key]) === String(o.v)}"><span class="ci">${icon(o.ic)}</span><span><b>${o.t}</b><small>${o.d}</small></span><span class="end">${o.rec ? '<span class="tag-rec">Recomendado</span>' : ''}<span class="tick">${icon('check')}</span></span></button>`).join('')}</div>`;
    if (step.id === 'ritmo') {
      const rem = [['manana', 'Mañana · 8:00'], ['mediodia', 'Mediodía · 12:30'], ['noche', 'Noche · 20:00'], ['no', 'Sin recordatorio']];
      h += `<div class="ob-extra"><h3>Recordatorio diario</h3><div class="seg-chips">${rem.map(([v, t]) => `<button type="button" data-ob="recordatorio" data-v="${v}" aria-pressed="${ob.p.recordatorio === v}">${t}</button>`).join('')}</div>
        ${ob.p.recordatorio !== 'no' ? `<div class="seg-chips">${[['whatsapp', 'Por WhatsApp'], ['correo', 'Por correo']].map(([v, t]) => `<button type="button" data-ob="canal" data-v="${v}" aria-pressed="${ob.p.canal === v}">${t}</button>`).join('')}</div>` : ''}</div>`;
    }
  } else if (step.id === 'fecha') {
    h = `<h1>${step.title}</h1><p class="sub">${step.sub}</p><div class="months">${monthList().map(m => `<button type="button" class="month" data-ob="fecha" data-v="${m.v}" aria-pressed="${ob.p.fecha === m.v}">${MONTHS[m.m]}<small>${m.y}</small></button>`).join('')}
      <button type="button" class="month wide" data-ob="fecha" data-v="nose" aria-pressed="${ob.p.fecha === 'nose'}">Aún no tengo fecha</button></div>`;
  } else if (step.id === 'nivel') {
    h = `<h1>${step.title}</h1><p class="sub">${step.sub}</p><div class="lvl-pick">${['A1', 'A2', 'B1', 'B2'].map(l => `<button type="button" data-ob="nivel" data-v="${l}" aria-pressed="${ob.p.nivel === l}">${l}<small>${l === 'A2' ? 'Tu test' : { A1: 'Principiante', B1: 'Intermedio', B2: 'Avanzado' }[l]}</small></button>`).join('')}</div>
      <a class="ob-link" href="https://pathway-languages.com/test-placement.html" target="_blank" rel="noopener">Volver a hacer el test de nivel</a>`;
  } else if (step.id === 'plan') {
    const p = ob.p;
    h = `<h1>Tu plan está listo</h1><p class="sub">Ryan lo verá antes de tu próxima clase. Puedes cambiarlo cuando quieras en tu perfil.</p>
      <div class="plan">
        <div><span>Objetivo</span><b>${p.motivo === 'rp' || !p.motivo ? 'NCLC 7 en las 4 competencias' : MOTIVOS[p.motivo]}</b></div>
        <div><span>Examen</span><b>${EXAMS[p.examen] || EXAMS.nose}</b></div>
        <div><span>Fecha</span><b>${fechaLabel(p.fecha)}</b></div>
        <div><span>Nivel de partida</span><b>${p.nivel}</b></div>
        <div><span>Meta diaria</span><b>${RITMOS[p.goal] || RITMOS[50]}</b></div>
        <div><span>Recordatorio</span><b>${p.recordatorio === 'no' ? 'Ninguno' : `${{ manana: '8:00', mediodia: '12:30', noche: '20:00' }[p.recordatorio]} · ${p.canal === 'correo' ? 'correo' : 'WhatsApp'}`}</b></div>
        <div class="first"><span>Primera lección</span><b>${A2.unit1.title}</b></div>
      </div>`;
  }
  $('#obBody').innerHTML = `<div class="ob-q">${h}</div>`;
  $('#obBody').scrollTop = 0;
  const last = ob.i === OB.length - 1;
  $('#obFoot').innerHTML = `<span class="hint">${ob.i + 1} de ${OB.length}</span><button type="button" class="btn btn-dark" id="obNext" ${obReady(step) ? '' : 'disabled'}>${ob.i === 0 ? 'Empezar' : last ? 'Entrar al campus' : 'Continuar'}<span class="arrow">${icon('arrow')}</span></button>`;
  $('#obNext').onclick = obNext;
}
function obNext() {
  if (!obReady(OB[ob.i])) return;
  if (ob.i < OB.length - 1) { ob.i++; return renderOb(); }
  S.profile = { motivo: 'rp', examen: 'nose', fecha: 'nose', goal: 50, ...ob.p };
  S.goal = S.profile.goal; S.onboarded = true; S.mode = 'alumno'; save();
  obEl.hidden = true; document.body.classList.remove('no-scroll');
  if (location.hash !== '#inicio') location.hash = 'inicio'; else route();
  confetti(); toast('Bienvenida al campus, Valentina.');
}
$('#obBack').onclick = () => { if (ob.i > 0) { ob.i--; renderOb(); } };
obEl.addEventListener('click', e => {
  const b = e.target.closest('[data-ob]'); if (!b) return;
  const k = b.dataset.ob; let v = b.dataset.v; if (k === 'goal') v = +v;
  ob.p[k] = v; renderOb();
  if (k !== 'recordatorio' && k !== 'canal') setTimeout(() => $(`[data-ob="${k}"][data-v="${b.dataset.v}"]`)?.focus(), 0);
});
document.addEventListener('keydown', e => {
  if (obEl.hidden) return;
  if (e.key === 'Enter' && !(e.target.closest && e.target.closest('[data-ob],a,#obBack'))) { e.preventDefault(); obNext(); }
});

$('#resetDemo').onclick = () => { S = fresh(); save(); flipped = false; seg = 0; if (location.hash !== '#inicio') location.hash = 'inicio'; else route(); openOnboarding(); };
$('#replayOb').onclick = openOnboarding;
route();
if (!S.onboarded) openOnboarding();
})();
</script>

</body>
</html>
